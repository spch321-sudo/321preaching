：資訊→啟示→信服→實踐→檢討→修正→反覆→繁殖。講完24小時內完成，一次只改一項。", "rvSave": "儲存檢討", "rvNeed": "請先填寫內容", "rvSaved": "已儲存，願主使你一次比一次更合用", "rvFix": "下次修正：", "rvGood": "好：", "rvImp": "改進：", "rvDelQ": "刪除這筆檢討？", "rvDef": "講道檢討", "tmT": "講道練習計時器", "start": "開始", "pause": "暫停", "resume": "繼續", "over": "已超過預定 {0}", "remain": "剩餘 {0}　共 {1}", "segSet": "段落設定（分鐘）", "addSeg": "＋ 段落", "newSeg": "新段落", "meT": "我的", "setRead": "閱讀設定", "font": "字級", "theme": "主題", "themes": "跟隨系統|淺色|深色|米黃", "lang": "語言", "voice": "朗讀聲音", "voiceNames": "雲哲（台灣男聲）|雲帆（男聲）|曉辰（女聲）", "rate": "朗讀速度", "rates": "慢|正常|快", "human": "真人語音", "humanS": "需要網路；關掉就用手機內建語音", "myMarks": "我的畫線與收藏", "myNotes": "我的領受筆記", "noNotes": "在每一課最後寫下領受，就會出現在這裡。", "backup": "資料備份", "backupS": "資料只存在這台裝置。換手機前請先匯出備份碼。", "exp": "匯出備份碼", "imp": "匯入備份碼", "expDone": "備份碼已複製，請貼到安全的地方", "impAsk": "請貼上備份碼", "impOk": "匯入成功", "impBad": "備份碼格式不正確", "copied": "已複製", "copyFail": "無法複製，請手動選取", "about": "關於", "aboutS": "321學神院・服事技能課程｜國度321空中團契<br>聖經經文：新標點和合本（神版）", "studioOpen": "經文美圖工作室", "studioS": "做卡片、配樂、錄影片，收在「我的作品」", "xzTool": "小智講道教練", "xzToolS": "請小智幫你看大綱、找例證、修應用", "marksTool": "我的畫線與收藏", "marksToolS": "上課畫過的句子、收藏的小智回答", "upd": "有新版本，點這裡更新", "xz": "小智講道教練", "t_xz_d": "你的講道陪練・321理念", "xzSys": "你是「小智」，國度321空中團契的屬靈同伴，也是321學神院「321講道服事」課程的講道教練。以321理念（耶穌是我的榜樣、聖經是我的準則、聖靈是我的引導；讓耶穌作王、讓耶穌得著一切的榮耀；建立屬神的體系）回應，深入淺出、善用比喻，引用和合本，回答簡明。融入：無己的生命；先生命再關係後事工；由內而外五重改變（觀念、生命、生活、關係、事工）；改變觀念八大步驟（資訊、啟示、信服、實踐、檢討、修正、反覆、繁殖）；服事之路（靈、悟、命、侍、神）。幫助講道者按著正意分解真理、找到中心思想、建構大綱、找例證、寫應用與呼召；不代替講道者禱告領受，要鼓勵他先倚靠聖靈。一律用繁體中文。", "xzHi": "平安！我是小智，你的講道教練。把經文、中心思想或大綱貼給我，我們一起按著正意分解真理的道。", "xzNote": "小智的回答僅供參考，請以聖經為準則，並在禱告中尋求聖靈的引導。", "xzNew": "新對話", "xzPh": "請問小智……（Enter 送出，Shift+Enter 換行）", "send": "送出", "xzOffline": "現在沒有網路，連上網路後再問小智。", "xzFail": "小智連不上", "delConfirm": "確定清除這些對話？", "saved": "已儲存", "loading": "載入中…", "reading": "朗讀", "xzQuick": "怎樣找出一段經文的中心思想？|幫我為雅各書1:22-25寫一個三點大綱|講道時怎樣才能「無己」，不傳自己？|怎樣分辨是聖靈的感動，還是自己的想法？|給我三個關於謙卑的生活例證|如何用五重改變寫出具體的應用？|如何做一個清楚、溫柔、不操縱人的呼召？|上台前很緊張，用心靠聖靈該怎麼做？|講完被批評，怎樣謙卑面對、檢討修正？|怎樣在235的關係中培養新的講道者？", "xzCtx": "使用者正在上：{0}・{1}。鑰節（{2}）：{3}。本課重點：{4}", "modeHl": "點一句畫線", "askXz": "問小智", "special": "專題", "kitT": "真理料理包工作坊", "kitS": "神引導人、人引導AI、AI完成工作：備料、加工、內化、一包多用", "kitErr": "工作坊載入失敗，請檢查網路", "xzCont": "繼續回答", "xzContAsk": "請接著你上一則回答的最後一句，繼續把沒寫完的部分寫完；不要重複已經寫過的內容，也不要重新開頭。", "mxMiss": "影音功能（小智寫祝福、配樂、錄音、卡片影片、自拍影片、我的作品）載入失敗：請確認 media.js 已上傳到同一個資料夾，再按"}};var LESSONS_BY={zh:[{"n": 1, "t": "講道者先是蒙恩的人", "sub": "生命先於事工", "key": {"r": "提摩太前書 4:16", "x": "你要謹慎自己和自己的教訓，要在這些事上恆心；因為這樣行，又能救自己，又能救聽你的人。"}, "big": "講台上的信息，是講台下的生命結出來的果子。先有生命，再有關係，後有事工。", "secs": [{"h": "一、保羅的次序：先自己，後教訓", "p": ["保羅吩咐提摩太「要謹慎自己和自己的教訓」，次序很清楚：先是「自己」，然後才是「教訓」。這不是修辭，而是屬靈的定律。一棵樹先要有生命，才能結果子；一位講道者先要被神的話改變，才能用神的話改變人。", "許多人學講道，一開始就問：「怎麼寫大綱？怎麼講得好聽？」這些都重要，但不是起點。就像蓋房子先打地基，地基看不見，卻決定整棟房子能蓋多高。講道者的生命就是講道的地基。"]}, {"h": "二、管子的比喻：神的話要先流過我", "p": ["講道者像一條水管，活水從神那裡流出來，經過我們，流到聽眾那裡。水管本身不產生水，但若管子髒了，流出去的水也會帶著鏽味。所以神要先潔淨我們，叫流出去的話語清潔、甘甜、有生命。", "這就是為甚麼我們預備講章時，第一個聽眾不是會眾，而是自己。當你讀經時先被扎心、先悔改、先感恩、先順服，你上台說的話就有分量，因為那是你親身嚐過的主恩。"]}, {"h": "三、由內而外的五重改變", "p": ["321理念告訴我們：改變觀念就改變生命，改變生命就改變生活。講道者自己要先經歷這五重改變——觀念、生命、生活、關係、事工。事工是最外面的一圈，卻是最後才結的果子。", "若一個人觀念沒有被神的話更新，生命沒有被基督充滿，生活和關係都亂了，卻在台上滔滔不絕，他講得再好，也只是「鳴的鑼，響的鈸」。反之，一個生命被主得著的人，哪怕講得樸實，聖靈也會使用他的話。"]}, {"h": "四、蒙召是恩典，不是資格", "p": ["我們能站在講台上，不是因為我們比別人好，而是因為神的恩典。保羅說「在罪人中我是個罪魁」，卻蒙了憐憫。講道者最大的危險，是把恩典當作資格，把講台當作舞台。", "當你記得自己是一個蒙恩的罪人，你就不會高高在上地教訓人，而是像一個討飯的告訴另一個討飯的：我在哪裡找到了餅。這樣的講道，有溫度，有謙卑，也有能力。"]}], "c321": ["三個基礎：耶穌是我的榜樣——祂三十年在拿撒勒的隱藏生活，先於三年半的公開傳道；聖經是我的準則——「謹慎自己」是神的命令；聖靈是我的引導——唯有聖靈能光照我們看見自己的真實光景。", "先生命、再關係、後事工：講道是事工，但它的根在生命，它的枝在關係。不要為了講道（事）而犧牲與神、與家人、與弟兄姊妹的關係（人）。"], "act": ["本週每天用15分鐘讀一段經文，先不想「怎麼講」，只問「主要對我說甚麼」。", "寫下一件你最近從神話語領受、並且已經實踐的事，作為你自己的見證素材。", "請一位屬靈同伴（2）為你的生命代禱，並誠實分享你的軟弱。"], "chk": ["我最近一次被神的話扎心是甚麼時候？", "我的講道內容，有多少是我自己活過的？", "我是把講台當作服事的祭壇，還是表現的舞台？", "我與家人、與弟兄姊妹的關係，能否配得上我講的道？"], "disc": ["為甚麼保羅先說「謹慎自己」，後說「自己的教訓」？", "你曾否聽過一篇講得不華麗、卻深深感動你的道？為甚麼？", "在你的生命中，哪一重改變（觀念、生命、生活、關係、事工）最需要先被主更新？"], "pray": "主耶穌，祢是我的榜樣。求祢先在我裡面作工，叫我先被祢的話改變，再用祢的話服事人。讓我的生命配得上祢託付的信息，叫一切榮耀都歸給祢。奉主耶穌的名禱告，阿們。"}, {"n": 2, "t": "無己的傳講", "sub": "不是傳自己，乃是傳基督", "key": {"r": "哥林多後書 4:5", "x": "我們原不是傳自己，乃是傳基督耶穌為主，並且自己因耶穌作你們的僕人。"}, "big": "講道最大的敵人不是口才不好，而是「我」太大。無己，耶穌才能在講台上作王。", "secs": [{"h": "一、講台上最難處理的問題：我", "p": ["講道者常在心裡問：「他們覺得我講得好嗎？」「我有沒有出醜？」「下次會不會再請我？」這些問題的中心都是「我」。有己的講道，焦點在自己；無己的講道，焦點在耶穌。", "有己是人類墮落的根源。亞當離開人的本位，想要像神；講道者若想藉講台建立自己的名聲，也是同樣的驕傲——離開僕人的本位，抓住只屬於神的榮耀。"]}, {"h": "二、施洗約翰的榜樣：他必興旺，我必衰微", "p": ["施洗約翰是當時最受歡迎的講道者，群眾湧向他。可是當耶穌出來，他說：「他必興旺，我必衰微。」（約3:30）他把自己比作新郎的朋友，聽見新郎的聲音就甚喜樂。", "好的講道者像一面鏡子，人看鏡子不是為了看鏡框，而是看鏡中的光。鏡框越樸素、越乾淨，光就越清楚。當會眾離開時說「耶穌真好」，而不是「講員真棒」，那就是成功的講道。"]}, {"h": "三、保羅的決定：只知道耶穌基督並他釘十字架", "p": ["保羅到哥林多時，那是一個崇尚口才與哲學的城市。他本可以展示學問，卻「定了主意」：「在你們中間不知道別的，只知道耶穌基督並他釘十字架。」（林前2:2）", "他接著說：「我說的話、講的道，不是用智慧委婉的言語，乃是用聖靈和大能的明證，叫你們的信不在乎人的智慧，只在乎神的大能。」（林前2:4-5）無己不是沒有恩賜，而是不倚靠恩賜；不是沒有預備，而是不倚靠預備。"]}, {"h": "四、無己不是沒有，乃是進入無限", "p": ["有人以為無己就是畏縮、不敢講。其實正相反。「現在活著的不再是我，乃是基督在我裏面活著。」（加2:20）當「我」退下，基督就在我裡面活出來；有限的我被放下，無限的基督就透過我說話。", "所以無己的講道者反而最有膽量，因為他不怕失敗——失敗傷的是「我」的面子，而「我」已經和基督同釘十字架了。謙卑戰勝驕傲，無己戰勝撒但。"]}], "c321": ["兩個核心：讓耶穌作王——講台的主人是耶穌，不是講員；讓耶穌得到一切的榮耀——講完之後把讚美交給主。", "驕傲是離開本位、抓住權力；謙卑是放下權力、回到本位。講道者的本位是僕人和使者，信息的主權在差遣他的王。"], "act": ["上台前做一個「卸冠禱告」：把對讚美的渴望、對批評的懼怕，一一交給主。", "講完後一小時內，不主動詢問別人的評價，先向主獻上感謝。", "檢查你的講章，把所有以「我」為中心的例證，改寫成指向基督的見證。"], "chk": ["我講道時最在意的是神的同在，還是人的反應？", "被稱讚時我的心會不會飄起來？被批評時會不會沉下去？", "我的講章裡，耶穌出現的次數和分量足夠嗎？", "我是否能真心為別人講得比我好而歡喜？"], "disc": ["施洗約翰「必衰微」的心態，在今天的講台上會是甚麼樣子？", "「無己不是沒有，乃是進入無限」——你怎麼理解這句話？", "你覺得驕傲在講道服事中最常以甚麼樣子出現？"], "pray": "主啊，我把自己放在祭壇上。求祢拆毀我心中想被看見、被肯定的驕傲，叫我不傳自己，只傳祢。願我衰微，願祢興旺；願我隱藏，願祢彰顯。奉主耶穌的名禱告，阿們。"}, {"n": 3, "t": "聖靈是我的引導", "sub": "在禱告中領受信息", "key": {"r": "以賽亞書 50:4", "x": "主耶和華賜我受教者的舌頭，使我知道怎樣用言語扶助疲乏的人。主每早晨提醒，提醒我的耳朵，使我能聽，像受教者一樣。"}, "big": "先作受教者，才能作教導者；先有受教的耳朵，才有受教者的舌頭。", "secs": [{"h": "一、耳朵先於舌頭", "p": ["以賽亞書50章的次序令人驚訝：神先「提醒我的耳朵，使我能聽」，然後才賜「受教者的舌頭」。講道首先不是說，而是聽。一個不會聽神說話的人，不可能為神說話。", "就像廣播電台，發射台的訊號清不清楚，取決於它接收的訊號清不清楚。講道者每天早晨在主面前「調頻」，接收從天上來的信息，主日才能清楚地發送出去。"]}, {"h": "二、聖靈是真理的引導者", "p": ["耶穌應許：「只等真理的聖靈來了，他要引導你們明白一切的真理；因為他不是憑自己說的，乃是把他所聽見的都說出來。」（約16:13）連聖靈都不憑自己說，祂把所聽見的說出來；講道者更當如此。", "保羅說：「我們講說這些事，不是用人智慧所指教的言語，乃是用聖靈所指教的言語，將屬靈的話解釋屬靈的事。」（林前2:13）人的智慧可以組織信息，唯有聖靈能賦予信息生命。"]}, {"h": "三、用心靠聖靈，不要用腦靠自己", "p": ["預備講章時，我們很容易一頭栽進資料、註釋、網路講章裡，用腦拼湊。這些工具有用，但它們是僕人，不是主人。「一生的果效是由心發出」（箴4:23），聖靈住在心中，不是住在腦中。用心就開心，用腦就煩惱。", "實際的做法是：先禱告後研讀，先默想後組織。拿到經文，先不打開註釋，安靜在主面前讀三遍，問聖靈：「祢今天要藉這段話對我和會眾說甚麼？」把第一個感動寫下來，那常常就是信息的種子。"]}, {"h": "四、分辨聖靈的感動", "p": ["如何知道是聖靈的感動，而不是自己的想法？有三個檢驗：第一，合乎聖經——聖靈絕不會說違背聖經的話；第二，高舉基督——聖靈的工作是榮耀耶穌（約16:14）；第三，結出果子——帶來悔改、信心、盼望與愛，而不是定罪、驚恐與混亂。", "再加上屬靈同伴的印證。在235的關係中，讓成熟的屬靈父母或戰友聽聽你的領受，鐵磨鐵，磨出刃來。"]}], "c321": ["三個基礎之一：聖靈是我的引導。服事之路的第一步是「靈」——尋求聖靈的引導及感動。", "改變觀念的八大步驟中，「資訊」之後是「啟示」：資料讀得再多，若沒有聖靈的啟示，只是資訊，不能改變生命。"], "act": ["本週為下一篇講章，每天早晨先安靜禱告10分鐘再讀經，寫下「今天的感動」。", "練習「三遍讀經法」：第一遍讀全貌，第二遍圈出觸動你的字，第三遍用禱告回應。", "把你的領受用三個檢驗（合聖經、高舉基督、結好果子）逐一核對。"], "chk": ["我預備講章的時間裡，禱告佔了多少？", "我是先找資料，還是先尋求神？", "我能說出這篇信息是「從主領受」的，還是「自己編排」的？"], "disc": ["為甚麼以賽亞書50:4把「耳朵」放在「舌頭」之前？", "你有沒有經歷過聖靈在預備或講道時，突然給你新的亮光？", "如何在使用註釋書和網路資源的同時，仍然倚靠聖靈？"], "pray": "聖靈啊，求祢每天早晨提醒我的耳朵，使我能聽，像受教者一樣。我不要憑自己說，只要說祢所指教的話。用祢的感動充滿我的心，叫我用心靠祢，不用腦靠自己。奉主耶穌的名禱告，阿們。"}, {"n": 4, "t": "聖經是我的準則", "sub": "按著正意分解真理的道", "key": {"r": "提摩太後書 2:15", "x": "你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。"}, "big": "講道不是借經文說自己的話，而是讓經文說神的話。先問「原來的意思」，再問「今天的意義」。", "secs": [{"h": "一、木匠的直線：「正意分解」", "p": ["「按著正意分解」原文有「筆直切割」的意思，像木匠沿著墨線鋸木頭，像農夫犁出一條直溝。講道者的責任，是沿著神所畫的線切下去，不偏左右，不把自己的意思加進去，也不把神的意思減掉。", "以斯拉時代的利未人給我們一個典範：「他們清清楚楚地念神的律法書，講明意思，使百姓明白所念的。」（尼8:8）念、講明、使明白——這就是解經講道的三個動作。"]}, {"h": "二、解經三步：觀察、解釋、應用", "p": ["第一步「觀察」：經文說了甚麼？誰、甚麼時候、在哪裡、發生甚麼、怎麼發生？留意重複的字、連接詞（因為、所以、但是）、命令句與應許。觀察越細，後面越穩。", "第二步「解釋」：經文原本是甚麼意思？要看上下文、看全書主旨、看歷史背景、以經解經。一段經文只有一個原意，卻可以有許多應用。第三步「應用」：這真理今天要如何改變我們的觀念、生命、生活、關係與事工？"]}, {"h": "三、避開三個常見的坑", "p": ["第一個坑是「斷章取義」：只取一句，不顧上下文，像從一封信剪下一行字，意思就完全變了。第二個坑是「寓意亂解」：把每個細節都硬配上屬靈意義，經文就變成講員想像力的遊樂場。", "第三個坑是「先有結論再找經文」：心裡早有想講的話，再去聖經找一節來背書。這等於讓聖經為我服務，而不是我為聖經服務。聖經是我的準則，不是我的工具。"]}, {"h": "四、以基督為中心讀全本聖經", "p": ["耶穌說：「給我作見證的就是這經。」（約5:39）以馬忤斯路上，祂「從摩西和眾先知起，凡經上所指著自己的話都給他們講解明白了」（路24:27）。他們後來說：「給我們講解聖經的時候，我們的心豈不是火熱的嗎？」", "無論講舊約或新約、敘事或詩歌，最終都要問：這段經文怎樣指向基督、怎樣需要基督、怎樣在基督裡成全？這樣，講道才不會淪為道德說教，而是福音的宣告。"]}], "c321": ["三個基礎之一：聖經是我的準則。服事之路的第二步是「悟」——領悟並遵行聖經的真理。", "從人的觀點改變成神的觀點，起點就是誠實地讓經文說話，不讓自己的觀點蓋過神的觀點。"], "act": ["選一段10節以內的經文，寫下至少20個觀察。", "為同一段經文寫一句「原意」與三句「今天的應用」。", "把你最近一篇講章拿出來，檢查有沒有斷章取義、寓意亂解或先結論後找經文的情形。"], "chk": ["我能用一句話說出這段經文的原意嗎？", "我有沒有看上下文、看全書主旨？", "我的講章最後有沒有把人帶到基督面前？"], "disc": ["為甚麼「觀察」常常是講道者最容易跳過的一步？", "你曾聽過哪一節經文被斷章取義地使用？正確的意思是甚麼？", "以馬忤斯門徒心裡火熱，和耶穌「講解聖經」有甚麼關係？"], "pray": "天父，祢的話是我腳前的燈、路上的光。求祢使我作無愧的工人，按著正意分解真理的道。不讓我的意思蓋過祢的意思，讓我在每段經文中都看見耶穌。奉主耶穌的名禱告，阿們。"}, {"n": 5, "t": "從人的觀點到神的觀點", "sub": "找出經文的中心思想", "key": {"r": "以賽亞書 55:8-9", "x": "耶和華說：我的意念非同你們的意念；我的道路非同你們的道路。天怎樣高過地，照樣，我的道路高過你們的道路；我的意念高過你們的意念。"}, "big": "一篇講章只有一個中心思想。找到神在這段經文裡的觀點，整篇信息就有了靈魂。", "secs": [{"h": "一、一篇道，一個重點", "p": ["許多講章像一個塞滿東西的行李箱，甚麼都有，打開卻找不到要的。好的講章像一支箭，只有一個箭頭，所有的羽毛和箭桿都是為了把箭頭送到靶心。", "這個箭頭就是「中心思想」：用一句完整的話說出「這段經文要說甚麼」以及「所以我們要怎樣」。若你不能用一句話說清楚，會眾也不可能用一句話記住。"]}, {"h": "二、四個觀點的轉換", "p": ["321理念提醒我們：改變觀點就能改變觀念。尋找中心思想時，要刻意做四個轉換：從人的觀點轉到神的觀點；從地上的觀點轉到天上的觀點；從暫時的觀點轉到永恆的觀點；從屬世的觀點轉到屬神的觀點。", "例如講約瑟被賣：人的觀點是「兄弟嫉妒害人」；神的觀點是「從前你們的意思是要害我，但神的意思原是好的」（創50:20）。同一段經文，換一個觀點，信息就從人間的悲劇變成神的救恩計畫。"]}, {"h": "三、提煉中心思想的三個問題", "p": ["第一問：這段經文在講「甚麼主題」？（例如：信心、謙卑、饒恕）第二問：關於這個主題，經文說了「甚麼」？（例如：謙卑的人蒙神施恩）第三問：神要我們因此「怎樣回應」？（例如：放下權力，回到本位）", "把答案合成一句：「因為神施恩給謙卑的人，所以我們要放下權力、回到本位，讓神作神。」這一句話就是你整篇講章的北極星，每一個段落都要朝它前進。"]}, {"h": "四、焦點在耶穌", "p": ["焦點在耶穌，不在自己、不在別人、不在環境。當中心思想只停留在「我們要更努力」，信息就成了律法的重擔；當中心思想指向「耶穌已經成就、所以我們能夠」，信息就成了福音的能力。", "天怎樣高過地，神的意念也照樣高過我們的意念。講道者的任務，就是把天上的意念帶到地上，讓會眾在一篇信息裡，從地上抬頭看見天。"]}], "c321": ["改變觀點就能改變觀念；改變觀念就能改變生命。中心思想是講道中「觀點轉換」的樞紐。", "焦點在耶穌：講道最終要讓人看見耶穌，而不是只看見問題、看見人、看見環境。"], "act": ["為下一篇講章寫出一句不超過40字的中心思想。", "用「四個觀點轉換」重新審視同一段經文，寫下每個轉換帶出的亮光。", "把中心思想念給一位家人聽，請他用自己的話覆述，檢查是否清楚。"], "chk": ["我能用一句話說出這篇講章的中心思想嗎？", "中心思想是從經文出來的，還是我加給經文的？", "它是指向「更努力」，還是指向「耶穌」？"], "disc": ["為甚麼一篇講章只應該有一個中心思想？", "挑一個你熟悉的聖經故事，試著從人的觀點轉到神的觀點。", "「焦點在耶穌」如何讓講道從重擔變成福音？"], "pray": "主啊，祢的意念高過我的意念。求祢開我的眼睛，在每段經文中看見祢的觀點，從地上抬頭望天，從暫時看見永恆。讓我所傳的每一篇信息，都把人的焦點帶回到耶穌身上。奉主耶穌的名禱告，阿們。"}, {"n": 6, "t": "搭建講章的骨架", "sub": "結構與大綱", "key": {"r": "傳道書 12:9-10", "x": "再者，傳道者因有智慧，仍將知識教訓眾人；又默想，又考查，又陳說許多箴言。傳道者專心尋求可喜悅的言語，是憑正直寫的誠實話。"}, "big": "好的結構像骨架，看不見卻撐起全身；讓會眾跟得上、記得住、帶得走。", "secs": [{"h": "一、傳道者的工法：默想、考查、陳說", "p": ["傳道書的作者「又默想，又考查，又陳說」，並且「專心尋求可喜悅的言語」。可見組織信息不是不屬靈的事，而是愛會眾的表現。神是有次序的神，「凡事都要規規矩矩地按著次序行」（林前14:40）。", "沒有結構的講道像一盤散沙，講員自己感動，會眾卻迷路。有結構的講道像一條鋪好的路，會眾可以一步一步跟著走，最後到達神要帶他們去的地方。"]}, {"h": "二、三種常用的結構", "p": ["「經文段落式」：順著經文的自然段落分點，最貼近經文，適合解經講道。「問題答案式」：先提出一個生活中的問題，再從經文找答案，適合福音性或主題性信息。「故事推進式」：跟著敘事的情節發展，在轉折處帶出真理，適合舊約故事與福音書。", "無論哪一種，大綱的每一點都要直接支持中心思想。就像房子的柱子，每一根都要頂住同一片屋頂。"]}, {"h": "三、寫好大綱的四個原則", "p": ["第一，平行：各點的句型一致，例如都用「神……所以我們……」。第二，簡短：每點不超過15字，會眾聽一次就記得。第三，順序：由淺入深、由內而外，或照著經文的次序。第四，數量：通常二到四點，三點最易記。", "一個好的範例：「從約拿書看神的心」——一、神追趕逃跑的人；二、神拯救悔改的人；三、神教導生氣的人。三點平行、簡短、照經文次序，又都指向「神的憐憫」這個中心。"]}, {"h": "四、每一點都有三個元素：講明、說明、應用", "p": ["每一大點之下，可以有三個元素：「講明」——這點在經文裡怎麼說；「說明」——用比喻、例證讓它清楚；「應用」——這對我們今天意味著甚麼。就像一個人有骨、有肉、有血。", "不必每一點都用同樣比例，但缺了任何一樣，信息就會失衡：只有講明太乾，只有說明太輕，只有應用太重。三者合一，才有一篇活的講章。"]}], "c321": ["服事之路的第四步是「侍」：讓耶穌在我裡面作王，靠祂的權柄能力服事。結構是器皿，聖靈是內容的生命。", "改變觀念八大步驟中的「實踐、檢討、修正、反覆」，正是練好大綱的過程，不要怕重寫。"], "act": ["為你的中心思想寫三種不同結構的大綱，選出最清楚的一個。", "把大綱每點修到15字以內、句型平行。", "在每一大點下標出「講明、說明、應用」三個元素。"], "chk": ["每一點都直接支持中心思想嗎？", "大綱點數是否太多？會眾聽一次能記住嗎？", "我有沒有把結構當成主角，而忘了倚靠聖靈？"], "disc": ["結構和聖靈的引導會衝突嗎？為甚麼？", "你最記得哪一篇講道的大綱？為甚麼它令你印象深刻？", "試著為詩篇23篇寫一個三點大綱。"], "pray": "有次序的神，求祢賜我智慧，像傳道者一樣默想、考查、陳說。讓我所預備的結構成為合用的器皿，裝滿祢的生命與真理，叫會眾能明白、能記住、能遵行。奉主耶穌的名禱告，阿們。"}, {"n": 7, "t": "讓真理活起來", "sub": "比喻、例證與見證", "key": {"r": "馬可福音 4:33", "x": "耶穌用許多這樣的比喻，照他們所能聽的，對他們講道。"}, "big": "真理是骨架，例證是窗戶；窗戶讓光照進來，讓人看見真理的模樣。", "secs": [{"h": "一、耶穌是最好的講道者", "p": ["耶穌講天國，不用抽象的神學名詞，而是說撒種、芥菜種、麵酵、失羊、浪子。祂「照他們所能聽的」對他們講道。這句話很重要：講道不是我能講多深，而是他們能聽多少。", "比喻像一座橋，一頭連著人熟悉的生活，一頭連著人陌生的真理。人走上熟悉的那一端，不知不覺就被帶到真理那一端。"]}, {"h": "二、好例證的四個條件", "p": ["第一，清楚：一聽就懂，不需要再解釋例證本身。第二，貼切：真正說明那一點，而不是只是好聽的故事。第三，貼近：來自會眾的生活——廚房、辦公室、手機、菜市場。第四，真實：見證要誠實，不誇大、不移花接木，更不能把別人的經歷說成自己的。", "例證是窗戶，不是房子。一個例證講得太長，會眾記得故事卻忘了真理，就像人只顧欣賞窗框，卻沒看見窗外的風景。"]}, {"h": "三、例證從哪裡來", "p": ["從聖經來：以經解經的例證最有權威，例如用大衛與歌利亞說明信心。從生活來：隨身帶一本「例證本」，看到、聽到、經歷到的事隨手記下。從受造界來：「神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得。」（羅1:20）", "從自己的見證來：最有力量的例證是你自己被神改變的經歷。但要記得無己的原則——見證的主角是耶穌，不是我；要說「主如何幫助我」，而不是「我如何屬靈」。"]}, {"h": "四、說故事的技巧", "p": ["好故事有四個元素：人物、處境、轉折、結果。用具體的細節代替抽象的形容，例如不說「他很難過」，而說「他坐在醫院走廊，手機握在手裡，一直沒有按下撥號鍵」。", "講完故事後，要用一句話把故事接回真理：「神也是這樣……」不要讓會眾自己去猜。窗戶開了，還要指著窗外說：「你看，那就是神的愛。」"]}], "c321": ["耶穌是我的榜樣：祂是用比喻講道的大師，也是「道成了肉身」的終極例證。", "見證要無己：讓耶穌得著一切的榮耀，見證的焦點是神的恩典，不是自己的成就。"], "act": ["開始一本「例證本」（或使用本App的筆記），本週至少記下5個生活例證。", "為你的講章每一大點配一個例證，並寫出把例證接回真理的那句話。", "把你自己的一個見證寫成300字，檢查主角是耶穌還是自己。"], "chk": ["我的例證是窗戶，還是喧賓奪主的房子？", "例證是否真實、沒有誇大？", "我是否用了會眾生活中熟悉的畫面？"], "disc": ["耶穌的比喻中，哪一個對你最有幫助？為甚麼？", "分享一個你聽過、至今仍記得的講道例證。", "見證如何講才能「無己」，讓主得榮耀？"], "pray": "主耶穌，祢用比喻打開人的心。求祢使我的眼睛看見生活中的比喻，使我的口照著人所能聽的講說祢的道。讓每一扇窗都透出祢的光，叫人看見祢的榮美。奉主耶穌的名禱告，阿們。"}, {"n": 8, "t": "從聽道到行道", "sub": "五重改變的應用", "key": {"r": "雅各書 1:22", "x": "只是你們要行道，不要單單聽道，自己欺哄自己。"}, "big": "沒有應用的講道，像一張沒有地址的信；寫得再美，也送不到人的生活裡。", "secs": [{"h": "一、鏡子的比喻", "p": ["雅各說，聽道而不行道的，「就像人對著鏡子看自己本來的面目，看見，走後，隨即忘了他的相貌如何。」神的話是一面鏡子，講道的目的不是讓人欣賞鏡子，而是讓人看見自己、整理自己。", "所以每一篇講章都要回答：「那又怎樣？」（So what?）會眾聽完以後，週一早上醒來，生活會有甚麼不同？"]}, {"h": "二、五重改變的應用架構", "p": ["321理念的「由內而外五重改變」，正是最完整的應用架構。觀念：這真理要更新我哪一個想法？生命：要培養基督的哪一種性情？生活：在日常中要具體做甚麼？關係：要與神、與己、與人怎樣和好？事工：要如何服事、如何建立屬神的體系？", "不需要每篇都五重全講，但要從內而外：先改觀念，才有持久的行為改變。只要求外在行為，不觸及內在觀念，就像在枯樹上綁水果，看起來有果子，其實沒有生命。"]}, {"h": "三、具體、可行、有時間", "p": ["「我們要更愛人」是方向，不是應用。好的應用要具體：「這週為一位你難以相處的同事禱告三次，並請他喝一杯咖啡。」要可行：是一般會眾做得到的。要有時間：今天、本週、這個月。", "也要照顧不同的人：信主多年的、剛信主的、還沒信主的、正在受苦的。一篇道可以有一個中心，卻能給不同的人不同的一步。"]}, {"h": "四、應用從恩典出發", "p": ["應用最容易滑入律法主義：「你應該、你必須、你不夠好」。但福音的應用次序是：因為基督已經為你成就了，所以你可以這樣活。不是為了得救而行善，而是因為得救而行善。", "舊人有己的生命做不到，新人無己的生命才做得到。所以每個應用的盡頭，都要把人帶回十字架與復活：「我靠著那加給我力量的，凡事都能做」（腓4:13）。"]}], "c321": ["改變觀念就改變生命，改變生命就改變生活；五重改變是講道應用的骨架。", "改變從我開始：講道者要先在自己身上實踐這個應用，才能有說服力地呼召別人。"], "act": ["為下一篇講章，按觀念、生命、生活、關係、事工各寫一個應用，再挑出最重要的兩個。", "把每個應用改寫成「具體、可行、有時間」的句子。", "檢查應用的語氣：是「因為基督……所以你可以」，還是「你應該……」？"], "chk": ["會眾聽完後，知道週一要做甚麼嗎？", "我的應用是從內而外，還是只要求外在行為？", "我自己有沒有先活出這個應用？"], "disc": ["為甚麼許多講道感動很多，改變很少？", "用五重改變分析一段你最近讀的經文。", "律法式的應用和福音式的應用，聽起來有甚麼不同？"], "pray": "主啊，叫我不只作聽道的人，更作行道的人。求祢用祢的話作鏡子照亮我，也藉我所傳的道照亮會眾，使我們由內而外被更新，在生活中活出基督。奉主耶穌的名禱告，阿們。"}, {"n": 9, "t": "開頭與結尾", "sub": "引人入門，帶人回應", "key": {"r": "使徒行傳 2:37", "x": "眾人聽見這話，覺得扎心，就對彼得和其餘的使徒說：「弟兄們，我們當怎樣行？」"}, "big": "開頭打開門，結尾帶人走進去。最好的結尾，是讓會眾自己問：「我們當怎樣行？」", "secs": [{"h": "一、開頭：前兩分鐘決定後面三十分鐘", "p": ["會眾坐下時，腦子裡還在想停車、孩子、工作。開頭的任務，是把他們的注意力從各處收回來，帶到神的話語面前。保羅在雅典，從一座寫著「未識之神」的壇開始講（徒17:23），從他們熟悉的事物進入福音。", "好的開頭有幾種：一個切身的問題、一個簡短的故事、一個令人驚訝的事實、一個生活的困境。原則只有一個：快速連到中心思想。開頭像飛機起飛，跑道太長，乘客就不耐煩了。"]}, {"h": "二、開頭要避免的事", "p": ["避免冗長的道歉：「我沒有準備好、我口才不好……」這會讓會眾失去信心，也把焦點拉回自己。避免與主題無關的笑話：笑聲過後，人們不知道你要講甚麼。", "也避免「從創世記講起」：背景要交代，但只交代會眾需要知道的部分。開頭不是你知道多少，而是會眾需要多少。"]}, {"h": "三、結尾：收網的時刻", "p": ["彼得在五旬節的講道，結尾是一個清楚的呼召：「你們各人要悔改，奉耶穌基督的名受洗，叫你們的罪得赦，就必領受所賜的聖靈」（徒2:38）結果「那一天，門徒約添了三千人」。", "結尾不是把講過的再講一遍，而是把中心思想用最精煉的一句話再敲一次，然後清楚地邀請人回應。漁夫撒了網，最後一定要收網。"]}, {"h": "四、呼召的屬靈原則", "p": ["呼召可以是：決志信主、悔改認罪、奉獻生命、一個具體的行動、安靜默禱。呼召要清楚、溫柔、不操縱。我們可以懇切，但不可以用情緒壓力或罪疚感逼人做決定，因為改變人心的是聖靈，不是講員。", "結尾把榮耀歸給神。最後的禱告不是講員的總結表演，而是帶領會眾一同來到主面前，讓耶穌在每個人心中作王。"]}], "c321": ["改變觀念的八大步驟中，「信服」之後是「實踐」：結尾的呼召，就是幫助會眾從信服跨到實踐的那一步。", "讓耶穌作王：呼召的目的不是讓人跟隨講員，而是讓人降服於基督。"], "act": ["為你的講章寫三種開頭（問題、故事、事實），選出最快連到中心思想的一個。", "把中心思想濃縮成一句15字以內的「結尾金句」。", "寫下一個清楚、溫柔、不操縱的呼召，並配上結束禱告。"], "chk": ["我的開頭在兩分鐘內連到主題了嗎？", "我的結尾有沒有清楚的邀請？", "我的呼召倚靠的是聖靈，還是情緒壓力？"], "disc": ["你聽過最吸引你的講道開頭是甚麼？", "彼得的講道為甚麼能讓人「覺得扎心」？", "呼召與操縱的界線在哪裡？"], "pray": "主啊，求祢使我的開頭打開人心的門，使我的結尾帶人走進祢的恩典。我不倚靠技巧與情緒，只倚靠聖靈的大能，讓聽道的人扎心、悔改、跟隨祢。奉主耶穌的名禱告，阿們。"}, {"n": 10, "t": "用心靠聖靈傳講", "sub": "聲音、身體與台風", "key": {"r": "以弗所書 6:19", "x": "也為我祈求，使我得著口才，能以放膽開口講明福音的奧祕，"}, "big": "傳講是全人的敬拜：心先火熱，聲音、眼神與身體才會跟著說同一件事。", "secs": [{"h": "一、連保羅都求代禱", "p": ["使徒保羅寫信時正被捆鎖，他沒有求釋放，卻求弟兄姊妹為他禱告「使我得著口才，能以放膽開口」。口才與膽量不是天生的專利，而是可以求、可以被賜下的恩典。", "所以上台前最重要的準備，是有人為你禱告。建立一個代禱小隊，讓你的屬靈同伴在你講道時同心守望。"]}, {"h": "二、聲音：讓話語有溫度", "p": ["「你們的言語要常常帶著和氣，好像用鹽調和。」（西4:6）聲音有四個工具：速度、音量、音調、停頓。重要的地方放慢；溫柔處降低音量；激動處提高聲調；關鍵句前後停頓兩秒，讓話語落地。", "停頓是講道者最被低估的工具。音樂裡的休止符也是音樂，沉默讓會眾有空間思想，也讓聖靈有空間作工。"]}, {"h": "三、身體：眼神、手勢與站姿", "p": ["眼神接觸讓會眾覺得你在「對我說話」，而不是「對著稿子念」。把會場分成左、中、右三區，輪流看著不同的人。手勢要自然，與內容一致；站姿穩定，不搖晃、不來回踱步。", "講稿可以帶，但不要被講稿綁住。熟悉到能看一眼就講一段，你的眼睛才能從紙上抬起來，看見人。"]}, {"h": "四、用心，不是用腦", "p": ["技巧是器皿，心才是源頭。「一句話說得合宜，就如金蘋果在銀網子裏。」（箴25:11）合宜的話，來自一顆被聖靈充滿、愛會眾的心。用腦講道，會擔心忘詞、擔心表現；用心講道，會專注在神和人身上。", "緊張時，把焦點從自己移到耶穌身上：「主啊，這是祢的話，祢的會眾，祢的時刻。」用心就開心，用腦就煩惱。當你知道你是在為王傳話，你就能放膽，也能放鬆。"]}], "c321": ["服事之路的「命」：耶穌是我的榜樣——培養並活出耶穌的生命，連說話的語氣都帶著祂的恩典與真理。", "用心靠聖靈，不要用腦靠自己：講台上的平安來自聖靈的同在，不是技巧的熟練。"], "act": ["用手機錄下自己講一段5分鐘的信息，回放時只聽聲音，再看一次只看身體。", "在講稿上用符號標出「放慢、停頓、加重」的地方。", "邀請2-3位屬靈同伴組成你的講道代禱小隊。"], "chk": ["我講道時的眼神多在稿子上，還是在人身上？", "我的聲音有沒有變化，還是一直同一個速度與音量？", "上台前，我的心是被聖靈充滿，還是被緊張充滿？"], "disc": ["你覺得哪一種講道習慣最容易讓人分心？", "停頓為甚麼有力量？", "「放膽」和「放鬆」怎樣能同時存在？"], "pray": "聖靈啊，求祢賜我口才，使我能放膽開口講明福音的奧祕。潔淨我的嘴唇，溫暖我的聲音，使我的眼神與身體都流露基督的愛。我不用腦靠自己，只用心靠祢。奉主耶穌的名禱告，阿們。"}, {"n": 11, "t": "謙卑面對回應", "sub": "講道後的檢討與修正", "key": {"r": "彼得前書 5:5", "x": "你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服；因為神阻擋驕傲的人，賜恩給謙卑的人。"}, "big": "講完不是結束，而是成長的開始。謙卑是進步的鑰匙，神施恩給願意被修正的人。", "secs": [{"h": "一、講道後的兩個試探", "p": ["講得好時，試探是驕傲：「我真有恩賜。」講得不好時，試探也是驕傲，只是換了一張臉：「我不行，我再也不要講了。」兩者的中心都是「我」。", "驕傲激起驕傲，驕傲對抗驕傲，兩敗俱傷；謙卑帶動謙卑，謙卑對謙卑，達到雙贏。被讚美時，把讚美轉獻給神；被批評時，把批評當作神磨利你的磨刀石。"]}, {"h": "二、鐵磨鐵：建立回饋的關係", "p": ["「鐵磨鐵，磨出刃來；朋友相感也是如此。」（箴27:17）找一兩位愛你、也敢說真話的屬靈同伴，請他們固定給你回饋。問具體的問題：「中心思想清楚嗎？」「哪一段最有幫助？」「哪一段聽不懂？」", "聽回饋時，先說謝謝，不辯解。即使對方說得不全對，裡面也常有神要你聽見的一句話。謙卑是復興的鑰匙，也是講道進步的鑰匙。"]}, {"h": "三、用八大步驟檢討", "p": ["321理念的「改變觀念八大步驟」：資訊、啟示、信服、實踐、檢討、修正、反覆、繁殖，正好是講道者成長的循環。講完後，進入「檢討」：哪裡做得好？哪裡要改進？接著「修正」：下次具體要改甚麼？", "然後「反覆」：一次改一兩項，持續練習。不要想一次改完全部，那會令人灰心。就像學琴，一週練好一個小節，一年就能彈完一首曲子。"]}, {"h": "四、最終的評估者是神", "p": ["人的評價有用，但不是最終的。保羅說：「我被你們論斷，或被別人論斷，我都以為極小的事……但判斷我的乃是主。」（林前4:3-4）我們最終要問的是：「主啊，祢喜悅嗎？我忠心嗎？」", "有時講得平平，卻有人因此回轉；有時自覺很好，卻沒看見果效。果效在神手中。我們的責任是忠心撒種，叫它生長的是神。"]}], "c321": ["謙卑戰勝驕傲：神阻擋驕傲的人，賜恩給謙卑的人。講道後的檢討，是操練謙卑最實際的場所。", "改變觀念的八大步驟：檢討、修正、反覆，是講道者從失敗走向得勝的路。"], "act": ["講完後24小時內，用本App的「講道後檢討」工具完成一次檢討。", "邀請一位屬靈同伴用三個具體問題給你回饋，只說謝謝，不辯解。", "從回饋中選出一項，下次講道專門改進。"], "chk": ["被讚美時，我是否把榮耀歸給神？", "被批評時，我是否防衛或灰心？", "我有沒有固定給我說真話的屬靈同伴？"], "disc": ["為甚麼講得不好時的灰心，其實也是一種驕傲？", "怎樣給講員回饋才能既誠實又造就人？", "「判斷我的乃是主」如何讓講道者得自由？"], "pray": "主啊，我願以謙卑束腰。被稱讚時，叫我把冠冕放在祢腳前；被批評時，叫我在祢面前虛心受教。求祢用弟兄姊妹的話磨利我，叫我一次比一次更合祢用。奉主耶穌的名禱告，阿們。"}, {"n": 12, "t": "繁殖講道者", "sub": "讓耶穌得著一切的榮耀", "key": {"r": "彼得前書 4:11", "x": "若有講道的，要按著神的聖言講；若有服事人的，要按著神所賜的力量服事，叫神在凡事上因耶穌基督得榮耀。原來榮耀、權能都是他的，直到永永遠遠。奉主耶穌的名禱告，阿們。"}, "big": "講道的終點不是一篇好講章，而是建立屬神的體系：讓更多人能傳講神的話，叫神在凡事上得榮耀。", "secs": [{"h": "一、按著神的聖言講", "p": ["彼得說：「若有講道的，要按著神的聖言講。」這句話是整門課的總結：我們講的不是自己的意見，而是神的話；靠的不是自己的力量，而是神所賜的力量；目的不是自己的榮耀，而是「叫神在凡事上因耶穌基督得榮耀」。", "這正是服事之路的五個字：靈、悟、命、侍、神。聖靈引導，領悟真理，活出生命，靠主服事，榮耀歸神。"]}, {"h": "二、四代的傳承", "p": ["保羅對提摩太說：「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」（提後2:2）這裡有四代：保羅、提摩太、忠心的人、別人。講道恩賜不是要獨佔的寶藏，而是要傳遞的火把。", "一個講道者一生能講的道有限，但若他培養十個講道者，每人再培養十個，福音的聲音就會倍增。這就是八大步驟的最後一步：繁殖。"]}, {"h": "三、在235的關係中培養講道者", "p": ["繁殖講道者最好的環境，是235的屬靈關係：在2屬靈同伴中互相代禱、互相回饋；在3屬靈父母兒女的關係中帶領新人，讓他先分享見證、再帶查經、再講短講；在5屬靈戰友五重職份的團隊中，各按恩賜同工。", "具體的步驟是：我做你看、我做你幫、你做我幫、你做我看、你再去帶別人。耶穌就是這樣帶門徒的，先和他們同住，再差派他們出去。"]}, {"h": "四、冠冕放在寶座前", "p": ["啟示錄記載，二十四位長老「把他們的冠冕放在寶座前」（啟4:10）。講道者一生所有的講章、所有的果子、所有的稱讚，最終都要放在主的寶座前。「我栽種了，亞波羅澆灌了，惟有神叫他生長。」（林前3:6）", "這就是321講道服事的終點：讓耶穌作王，讓耶穌得到一切的榮耀，建立屬神的體系。願你成為一位得勝的講道者，也帶出更多得勝的講道者，邁進末後的大復興，迎接主耶穌再來。"]}], "c321": ["一個目的：建立屬神的體系。講道者繁殖講道者，就是在地上擴展神國的領土。", "兩個核心：讓耶穌作王，讓耶穌得到一切的榮耀。一切都是神在耶穌裡所作所成就的，都是神的恩典。"], "act": ["列出一位你可以開始培養的「提摩太」，為他禱告一週。", "邀請他在小家中分享一個3分鐘的見證，並給他鼓勵性的回饋。", "寫一封感恩信給曾經培養你講道的屬靈父母，並把這門課所學獻給主。"], "chk": ["我的講道恩賜是在建立自己，還是建立別人？", "我身邊有沒有一位我正在培養的講道者？", "我是否在凡事上把榮耀歸給神？"], "disc": ["提後2:2的四代傳承，在你的教會或小家中可以怎樣實行？", "「我做你看、我做你幫、你做我幫、你做我看」——你最常卡在哪一步？", "回顧12課，哪一課最改變了你對講道的觀念？"], "pray": "榮耀的主，我把這門課所學的一切都放在祢的寶座前。求祢使我按著祢的聖言講，按著祢所賜的力量服事，並使用我培養更多忠心的講道者。願祢在凡事上因耶穌基督得榮耀，直到永永遠遠。奉主耶穌的名禱告，阿們。"}, {"n": 13, "sp": true, "t": "真理料理包講道法", "sub": "AI時代的神人機協作", "key": {"r": "哥林多前書 1:24", "x": "但在那蒙召的，無論是猶太人、希臘人，基督總為神的能力，神的智慧。"}, "big": "神作神，人作人，AI作工具。次序對了，一切都對；真理料理包只是半成品，要先用聖靈純淨的活水加水，再用信心加熱、用見證加菜、用聖靈的感動加料，才能成為餵養人的生命之糧。", "secs": [{"h": "一、三智合一：源頭、承接者、輔助者", "p": ["聽到「AI」和「講道」放在一起，有人興奮：「終於可以讓AI幫我寫講章了！」有人擔心：「AI寫的講道還有聖靈的感動嗎？」有人排斥：「講道是聖靈的工作，AI不應該介入！」這三種反應都有道理，卻都只看到一部分的真相。我們不是要用AI取代聖靈，也不是排斥一切新工具，而是在神的引導下，善用神允許這個時代擁有的工具，更有效地傳遞真理、建立生命。", "這裡有三個智慧：基督是神的智慧，是一切智慧的源頭；我們是「神工智慧」，是神所造、神在裡面工作的人，是承接者；AI是「人工智慧」，是人所造的工具，是輔助者。源頭、承接者、輔助者——這個次序不能顛倒。", "這像水從山頂的泉源往下流：先流入河道（人），再流入灌溉渠道（工具），最後澆灌田地（會眾的生命）。泉源決定水質。源頭若是從神的話語和聖靈的引導而來，經過多少管道都是清水；源頭若被污染，管道再先進，流出來的還是污水。"]}, {"h": "二、神的智慧：基督是一切真理的源頭", "p": ["保羅宣告：「基督總為神的能力，神的智慧。」（林前1:24）基督不是「有」智慧，而是「就是」智慧本身。在崇尚希臘哲學的哥林多，保羅告訴他們：你們追求的智慧不在哲學殿堂裡，而在十字架上。", "「所積蓄的一切智慧知識，都在他裏面藏著。」（西2:3）科學、管理、溝通、心理學的洞見，若是真的，最終都指向基督。AI可以處理海量資訊、引用經文、排列神學知識，卻不認識基督，不能領受聖靈的啟示，也不能經歷與神的關係。離開了源頭，一切智慧都只是碎片。"]}, {"h": "三、神工智慧：我們是神的工作", "p": ["「我們原是他的工作，在基督耶穌裏造成的，為要叫我們行善，就是神所預備叫我們行的。」（弗2:10）「工作」的希臘文 poiēma 是英文 poem 的字根。你是神的詩歌、神的傑作，不是流水線上的產品，而是大師親手做成的作品。", "AI是「人工」的，是用數據和演算法訓練出來的；你是「神工」的，是神用祂的靈、祂的話和你一生的經歷塑造的。AI可以寫出文法完美的講章，卻不能流淚；可以列出一百個比喻，卻不能說「我親身經歷過」。你有三樣AI永遠沒有的：生命、經歷和聖靈。講道不是資訊傳遞，而是生命的分享。"]}, {"h": "四、人工智慧：是工具，不是主人", "p": ["AI能整理知識、搜尋經文與註釋、產生大綱、潤飾文字、製作投影片；但它不能取代聖靈的引導，不能為你禱告尋求神的心意，不能用生命觸動生命，也分辨不出「聖靈此刻要對這群人說的話」。", "AI像一把鋒利的刀：用來做菜，切出精美的料理；用來動手術，可以救命；但若讓刀來決定你做甚麼，就危險了。聖經是我的準則，AI不是。AI輸出的任何內容都要經過聖經真理檢驗：合乎聖經的採用，不合聖經的堅決捨棄。工具歸工具，主人歸主人。"]}, {"h": "五、神人機協作：次序與三條紅線", "p": ["正確的協作是：神引導人，人引導AI，AI完成工作。先透過禱告、讀經和聖靈的感動，領受神要你傳的核心信息；再帶著這個方向，請AI整理經文背景、例證、資料；最後AI按指示整理和執行。就像建造聖殿：神給圖紙，所羅門帶領工匠照圖施工，工匠用工具建造。工具重要，卻永遠不能比圖紙重要。", "這正是321理念的「讓人作人，讓神作神」：神作神，人作人，AI作工具。這裡有三條紅線：人不能取代神——「你要專心仰賴耶和華，不可倚靠自己的聰明」（箴3:5）；AI不能取代人——不能把AI寫的講章直接拿去念，會眾聽得出是分享生命還是讀別人的稿；AI更不能取代神——當你依靠AI告訴你「該講甚麼」，而不再倚靠聖靈，AI就已經佔了神的位置。在紅線之內，可以自由大膽地使用；越過紅線，就是危險地帶。", "「工欲善其事，必先利其器。」大衛用機弦，保羅用書信，印刷術讓聖經大量流通。有人說：「AI不會取代人，但會使用AI的人，將取代不會使用AI的人。」但「會使用AI」不等於「依賴AI」：前者是善用工具，後者是被工具使用。"]}, {"h": "六、甚麼是真理料理包", "p": ["超市的料理包把食材切好、配好，你不必從零備料，但仍要自己下鍋、調味、掌握火候。真理料理包也是這樣：聖靈引導人領受主題，人用AI整理素材，再整合成包含投影片、逐字稿、經文、比喻和應用的料理包。它幫你省下查資料、整理素材的時間，卻不能替你講道。", "一個完整的料理包有六大素材：一、聖經真理——核心經文、相關經文、原文、背景、神學脈絡，是主食材；二、聖靈啟示——你個人與神互動所領受的，無法用AI產生；三、321理念——三個基礎、兩個核心、一個目的，幫助會眾落實在生命中；四、科學知識——心理學、腦科學、管理學、歷史資料，佐證真理；五、比喻例證——讓真理具體、可感受、記得住；六、生活應用——聽完回去可以做的具體步驟。", "同一個料理包可以產出多種形式：投影片、逐字稿（用來內化，不是用來念）、字卡金句、一到三分鐘的短影片、播客。一篇講道不再只有主日那四十分鐘，而能在整個星期持續影響會眾的生命。"]}, {"h": "七、四加：加水、加熱、加菜、加料", "p": ["料理包不是成品，講道者要親自下鍋，總共「四加」，第一加是加水。加水，是加上聖靈純淨的活水。料理包是乾的、濃縮的，沒有水就煮不開、化不開。耶穌說：「信我的人就如經上所說：『從他腹中要流出活水的江河來。』耶穌這話是指著信他之人要受聖靈說的。」（約7:38-39）加水，就是預備和上台之前先求聖靈充滿、認罪潔淨，講的時候倚靠聖靈的同在與膏抹，讓活水從裡面流出來。這水要「純淨」：不摻雜自己的驕傲、表演和人的意思——無己，活水才流得出來。加水是聖靈親自澆灌的，所以放在最前面；有了活水，後面三加才煮得開，整篇信息才會活起來，滋潤聽的人。", "加熱，是用信心調和真理：「只是所聽見的道與他們無益，因為他們沒有信心與所聽見的道調和。」（來4:2）你要先被這段真理感動，不只研究經文，更要浸泡在經文裡。相傳奧古斯丁說：「你要點燃別人，自己必須先燃燒。」", "加菜，是加入你的生命見證：「弟兄勝過牠，是因羔羊的血和自己所見證的道。」（啟12:11）一兩段真實經歷，比十頁理論更有力量，因為人連結的不是資訊，而是生命。先生命、再關係、後事工——沒有生命的講道只是噪音，有生命的講道才是音樂。", "加料，是加入聖靈的個人感動。「好的講道」是內容正確、結構清晰；「對的講道」是聖靈此刻要對這群人說的話。預備時常問聖靈：「祢還要我加甚麼？要我強調甚麼？」也不要把每一分鐘排滿，要留白，讓聖靈在那些空間裡說話。"]}, {"h": "八、內化真理與講道流程", "p": ["四加之後，還要內化，讓料理包成為你自己的信息：熟讀，明白信息的脈絡；默想，「惟喜愛耶和華的律法，晝夜思想」（詩1:2），讓真理在心中反覆咀嚼；領受，記下聖靈給的新角度；整理，用自己的語言和節奏表達；成為你自己的信息，站上講台時講的是消化過、活過的生命。", "講道不是讀稿，不是表演，而是分享生命。保羅說：「不但願意將神的福音給你們，連自己的性命也願意給你們。」（帖前2:8）無己不是沒有，而是讓基督在你裡面活。", "完整的流程是：禱告開始——從禱告開始，不是從打開電腦開始；信息傳講——看著會眾，不是看著投影片；呼召決志——真理是用來回應的；回應禱告——留時間讓聖靈作深的工作；祝福禱告——「願耶和華賜福給你，保護你。願耶和華使他的臉光照你，賜恩給你。願耶和華向你仰臉，賜你平安。」（民6:24-26）"]}], "c321": ["三個基礎在AI時代更加重要：聖靈是我的引導——起點永遠是聖靈的引導，不是AI的輸出；聖經是我的準則——AI的一切輸出都要經過聖經檢驗；耶穌是我的榜樣——講道是分享基督在我裡面的生命。", "服事之路：靈（聖靈引導）→悟（領悟真理）→命（活出生命）→侍（靠耶穌服事）→神（榮耀歸神）。AI可以幫你整理、編排、潤飾，卻不能替你禱告、替你尋求聖靈、替你活出生命。讓人作人，讓神作神，AI作工具。"], "act": ["下一篇講道先禱告領受主題，再用本App的「真理料理包工作坊」請小智備料，並把每一項素材用聖經檢驗一次。", "為這篇信息先「加水」——求聖靈充滿、認罪潔淨，讓活水從裡面流出來；再「加菜」：寫下一段你親身經歷神帶領的見證（一兩段即可）。", "上台前做「內化五步」：熟讀、默想、領受、整理、成為自己的信息，並在講章裡留一段給聖靈的空白。"], "chk": ["我是先打開聖經、跪下禱告，還是先打開AI？", "這篇講章裡有沒有我自己的見證與聖靈給我的感動，還是只有AI整理的素材？", "我是倚靠聖靈的活水講道，還是倚靠講稿與技巧？我的心有沒有摻雜驕傲和表演？", "我有沒有越過三條紅線：人取代神、AI取代人、AI取代神？", "我是在善用工具，還是被工具使用？"], "disc": ["「神作神，人作人，AI作工具」——在你的服事中，哪一個次序最容易被搞反？", "你怎樣分辨AI提供的內容是否合乎聖經？請舉一個例子。", "加水、加熱、加菜、加料四加中，哪一加你最需要操練？為甚麼？"], "pray": "親愛的天父，感謝祢在這個時代賜給我們新的工具。幫助我們在使用任何工具之前，先來到祢面前——先禱告、先聆聽、先領受。讓聖靈永遠是我們的引導，聖經永遠是我們的準則，耶穌永遠是我們的榜樣。保守我們的心，不倚靠工具而忽略祢，也不排斥工具而錯過祢的供應。讓每一篇從真理料理包出發的講道，都先被聖靈純淨的活水澆灌，再經過我們的生命加溫、經過聖靈的調味，成為餵養靈魂的生命之糧。奉主耶穌的名禱告，阿們。"}]};var TOOLS_BY={zh:{"path": [["靈", "聖靈是我的引導——尋求聖靈的引導及感動"], ["悟", "聖經是我的準則——領悟並遵行聖經的真理"], ["命", "耶穌是我的榜樣——培養並活出耶穌的生命"], ["侍", "讓耶穌作王——靠耶穌的權柄能力服事"], ["神", "讓耶穌得到一切的榮耀——凡事謝恩"]], "tools": [["builder", "🛠️", "講章工作坊", "靈・悟・命・侍・神，九步驟完成一篇講章"], ["kit", "🍱", "真理料理包工作坊", "神引導人、人引導AI、AI完成工作"], ["drafts", "📂", "我的講章", ""], ["pre", "🙏", "講台前預備檢核", "上台前的心靈與實務檢查"], ["review", "📝", "講道後檢討", "用八大步驟檢討、修正、反覆"], ["timer", "⏱️", "講道練習計時器", "分段計時，掌握節奏"]], "bsteps": [{"k": "pray", "g": "靈", "t": "禱告領受", "h": "先不要打開註釋書。安靜在主面前讀經文三遍，問聖靈：「祢今天要藉這段話對我和會眾說甚麼？」寫下第一個感動。", "f": [["title", "講章題目（可稍後再定）", 0], ["pray", "聖靈給我的第一個感動", 1]]}, {"k": "text", "g": "悟", "t": "經文與觀察", "h": "誰？何時？何地？發生甚麼？留意重複字、連接詞（因為、所以、但是）、命令與應許。觀察越細越好。", "f": [["ref", "經文出處（例：雅各書1:22-25）", 0], ["obs", "我的觀察（至少10項）", 1]]}, {"k": "mean", "g": "悟", "t": "原意解釋", "h": "看上下文、全書主旨、歷史背景、以經解經。一段經文只有一個原意，卻可以有許多應用。這段經文如何指向基督？", "f": [["mean", "這段經文原本的意思", 1], ["christ", "這段經文如何指向基督", 1]]}, {"k": "big", "g": "命", "t": "中心思想", "h": "用一句話（40字內）說出「經文說甚麼」與「所以我們要怎樣」。試著從人的觀點轉到神的觀點、從地上轉到天上、從暫時轉到永恆、從屬世轉到屬神。", "f": [["big", "中心思想（一句話）", 0], ["view", "觀點轉換：人看……神看……", 1], ["me", "這真理先怎樣改變了我？", 1]]}, {"k": "outline", "g": "侍", "t": "結構大綱", "h": "二到四點，句型平行，每點15字內，都直接支持中心思想。每點下可有「講明、說明、應用」。", "f": [["p1", "第一點", 0], ["p2", "第二點", 0], ["p3", "第三點", 0], ["p4", "第四點（可空白）", 0]]}, {"k": "illus", "g": "侍", "t": "例證與見證", "h": "例證是窗戶，不是房子：清楚、貼切、貼近生活、真實。見證的主角是耶穌，不是我。", "f": [["illus", "每一點的例證", 1], ["testi", "我的見證（主如何幫助我）", 1]]}, {"k": "apply", "g": "侍", "t": "五重改變的應用", "h": "由內而外：觀念→生命→生活→關係→事工。要具體、可行、有時間；從恩典出發：「因為基督已成就，所以你可以……」", "f": [["a1", "觀念：要更新甚麼想法？", 0], ["a2", "生命：要培養基督的甚麼性情？", 0], ["a3", "生活：本週具體做甚麼？", 0], ["a4", "關係：與神、與己、與人怎樣和好？", 0], ["a5", "事工：如何服事、建立屬神體系？", 0]]}, {"k": "ends", "g": "侍", "t": "開頭與呼召", "h": "開頭兩分鐘內連到中心思想；結尾用一句金句再敲一次，清楚、溫柔、不操縱地邀請回應。", "f": [["open", "開頭（問題／故事／事實）", 1], ["gold", "結尾金句（15字內）", 0], ["call", "呼召與回應方式", 1]]}, {"k": "glory", "g": "神", "t": "禱告與榮耀歸神", "h": "把講章交在主手中。寫下結束禱告，並為上台前的自己寫一句「卸冠禱告」。結尾一律用「奉主耶穌的名禱告，阿們」。", "f": [["endp", "結束禱告", 1], ["crown", "卸冠禱告：主啊，這是祢的……", 1]]}], "pre": [["靈・聖靈的引導", ["我已為這篇信息禱告，並領受了聖靈的感動", "我已認罪悔改，心中沒有未處理的罪", "我有代禱同伴正在為我禱告"]], ["悟・聖經的準則", ["我能用一句話說出經文原意", "中心思想是從經文來的，不是我加上去的", "信息把人帶到基督面前"]], ["命・耶穌的榜樣", ["這篇信息先改變了我自己", "我的見證焦點是耶穌，不是我", "我與家人、同工的關係是和好的"]], ["侍・讓耶穌作王", ["大綱清楚、我熟悉到能抬頭看人", "應用具體、可行、有時間", "時間掌握在預定範圍內", "經文、投影、麥克風都已確認"]], ["神・榮耀歸神", ["我已把對稱讚的渴望與對批評的懼怕交給主", "我願意讓耶穌興旺，我衰微", "不論果效如何，我都把榮耀歸給神"]]], "rv": [["title", "講章題目／日期", 0], ["good", "做得好的地方（感謝主）", 1], ["fb", "屬靈同伴的回饋（只說謝謝，不辯解）", 1], ["improve", "需要改進的地方（檢討）", 1], ["fix", "下次只改一項（修正）", 0], ["glory", "把榮耀歸給神的禱告", 1]], "segs": [["開場引入", 3], ["經文與主體", 20], ["應用", 5], ["結尾呼召", 2]]}};

  const GXD = {"keys": ["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"], "icon": {"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"}, "names": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "hints": {"adult": "有深度，貼近工作、家庭與關係", "teen": "幽默風趣、不說教，用你的世界來比喻", "kid": "非常簡單好懂，像在聽故事", "seeker": "還沒信主也聽得懂，不說教，給實際的幫助", "elder": "尊敬溫和、慢慢說，句子清楚好懂", "single_parent": "先接住你的辛苦，給做得到的小步驟與盼望", "single": "真誠平等，不催婚，談身分、等待與使命", "parent": "貼近養兒育女的日常：溝通、管教、陪伴與禱告", "couple": "夫妻同行：溝通、饒恕、同心與一起禱告", "pastor": "同工口吻：牧養、講道預備、團隊與不倦怠"}, "lenNames": {"brief": "簡要", "mid": "適中", "full": "詳細"}, "len": {"brief": " 回答長度：簡要。整段回答控制在 3～5 句話（約 150 字內）：直接給核心答案、一句關鍵經文或一個比喻，最後一句禱告或一個小步驟。不用表格、不列長清單。", "full": " 回答長度：詳細。請完整、有條理地回答（約 800～1200 字）：說明經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期可以操練的具體步驟，最後以禱告結束。可用簡短小標題。"}, "aud": {"adult": {"sys": " 回答對象：成年人。請用成熟、沉穩而溫暖的口吻，可以有適度的深度：點出經文脈絡與關鍵字詞的意思，連結工作、婚姻、教養、人際與屬靈爭戰，最後帶出一個這星期就能操練的具體步驟。", "write": "\n讀者是成年人：口吻成熟、溫暖、真誠。", "style": "風格：沉穩清楚；其中一兩題帶出生命應用。", "res": ["再讀一遍這章，細細品味，下次會更好。", "不錯！這章的信息已經進到你裡面了。", "太棒了！經文的話已經住在你心裡。"], "q": ["這段經文讓我看見神是怎樣的一位神？", "這段經文照出我裡面什麼樣的舊人有己？", "若讓耶穌在這件事上作王，我會怎麼做？", "這段經文中，耶穌給我看見什麼樣的榜樣？", "聖靈要藉這段話引導我今天走哪一步？", "這裡的人為什麼會失敗？根源是驕傲還是恐懼？", "這段經文如何幫助我操練無己的生命？", "我可以把這段經文用在與誰的關係上？", "這段經文與主禱文「願你的國降臨」有什麼關聯？", "請用一個比喻幫我明白這段經文的核心。"], "fu": [["💍", "婚姻", "請針對你剛才的回答，說明怎麼把它應用在夫妻關係與婚姻裡，並給我一個這個星期可以做的具體小步驟。"], ["👨‍👩‍👧", "家庭", "請針對你剛才的回答，說明怎麼把它應用在家庭與教養孩子（或與父母相處）上，並給我一個這個星期可以做的具體小步驟。"], ["💼", "職場", "請針對你剛才的回答，說明怎麼把它應用在工作與職場上（同事、主管、壓力、誠信），並給我一個這個星期可以做的具體小步驟。"], ["🏡", "日常", "請針對你剛才的回答，說明怎麼把它應用在日常生活的小事上（時間、金錢、習慣），並給我一個這個星期可以做的具體小步驟。"], ["💭", "內心", "請針對你剛才的回答，說明怎麼把它應用在面對內心的情緒與軟弱上（焦慮、憤怒、驕傲），並給我一個這個星期可以做的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "teen": {"sys": " 回答對象：青少年（約12–18歲）。請用幽默風趣、輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷     });

  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();

        songBase[s.f] = b;
        return blob;

    }
    throw new Error(why || 'fail');

  /* ── 離開 App 再回來（或被系統重載）時接回原位：相機（10 分鐘內、且不在內嵌視窗）→ AI 配樂 → AI 生圖（12 小時內） ── */
  function resumeBoot() {
    let o = null, mode = '';
    if (!isFramed()) { o = lsTake('cam'); if (o && o.item && Date.now() - o.ts <= 10 * 60 * 1000) mode = 'cam'; else o = null; }
    if (!mode) { o = lsTake('mu'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'mu'; else o = null; }
    if (!mode) { o = lsTake('ai'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'ai'; else o = null; }
    if (!mode) return;
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      let ready = false;
      try { ready = !!(D && D.txt && S); } catch (e) { ready = false; }
      if (!ready) { if (tries > 40) clearInterval(iv); return; }

  /* ── iOS 分段 MP4 重新封裝（mx_*，照抄互動聖經，勿改）── */
function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }

}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }

function mx_parseTfhd(b,mx_box){

  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){

function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;

function mx_remux(bytes){

        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};

    const newTraks=[];

      const tkc=mx_children(b,tk);

  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;

  async function toggleRec() {

    hymnStop(); stopTTS();
    if (recMode === 's' && (!selfieStream || !selfieStream.active)) {
      try { selfieStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); }
      catch (e) { recMode = 'c'; camFail(e); paint(); }
      if (recMode === 's') { paint(); attachSelfie(); await new Promise(r => setTimeout(r, 500)); }
    }
    let mic;
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) {
      try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); }

    }

    let ac = null, bgmEl = null, bgmURL = null, audioStream = mic, micGain = null, bgmGain = null;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();

      const dst = ac.createMediaStreamDestination();
      micGain = ac.createGain(); micGain.gain.value = 0.0001;

    }

      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}

      await finishRec(new Blob(chunks, { type }), type, kind);

    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {

      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}

      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };

      const left = bgmEl.duration - bgmEl.currentTime;

    };

    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);

      '<p class="k3m-muted">' + esc(L('會議 ID', '会议 ID', 'Meeting ID')) + ' <b>' + MEET_ID + '</b>　' + esc(L('密碼', '密码', 'Passcode')) + ' <b>' + MEET_PASS + '</b></p></div>' +
      '<div class="k3m-box"><p class="k3m-eb">' + esc(L('聚會時間表', '聚会时间表', 'Meeting schedule')) + '</p>' + rows + '</div>' +

    '.k3m-btn{background:var(--card,#fff);border:1px solid var(--line,#ddd8cc);color:var(--ink,#1d2421)!important;margin-top:8px}' +

    '#k3mSheet{position:fixed;inset:0;z-index:2147483000;display:none}#k3mSheet.on{display:block}' +

    '#k3mSheet .k3m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line,#ddd8cc);background:var(--card,#fff)}' +
    '#k3mSheet .k3m-head b{font-size:1.05em}' +
    '#k3mSheet .k3m-x{border:0;background:transparent;font-size:22px;line-height:1;color:inherit;cursor:pointer;padding:4px 8px}' +

    '#k3mSheet .k3m-big{margin:0 0 6px;font-size:1.35em;line-height:1.4}' +
    '.k3m-box{background:var(--card,#fff);border:1px solid var(--line,#ddd8cc);border-radius:16px;padding:14px 16px;margin:12px 0}' +
    '.k3m-muted{color:var(--dusk,#6b7770);font-size:.9em;margin:10px 0 0}' +
    '.k3m-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line,#ddd8cc)}.k3m-row:last-child{border-bottom:none}' +
    '.k3m-row .k3m-btn.sm{margin-top:0}' +
    '.k3m-time{flex:0 0 auto;min-width:96px;background:var(--paper,#f3f1ec);border-radius:12px;padding:6px 10px;text-align:center;font-size:.88em;line-height:1.5}.k3m-time b,.k3m-time small{display:block}.k3m-time small{color:var(--dusk,#6b7770);font-size:.82em}' +
    '.k3m-mid{flex:1;min-width:0}.k3m-mid .t{font-weight:700}.k3m-mid .s{font-size:.82em;color:var(--dusk,#6b7770)}.k3m-mid .cd{font-size:.82em;color:#1F4D3D;font-weight:700}' +
    '.k3m-offer{border:1px solid var(--line,#ddd8cc);border-radius:12px;padding:12px 14px;margin-top:10px}' +
    '.k3m-offer .oc{display:inline-block;background:#1F4D3D;color:#fff;border-radius:8px;padding:2px 10px;font-size:.8em;font-weight:700}' +
    '.k3m-offer .oh{font-weight:700;margin:8px 0 2px;overflow-wrap:anywhere}.k3m-offer .od{color:var(--dusk,#6b7770);font-size:.9em}' +
    '.k3m-offer .oa{font-family:ui-monospace,Menlo,monospace;font-size:1.02em;margin:6px 0 4px;overflow-wrap:anywhere}' +
    '#k3mToast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(20,28,24,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:2147483001;pointer-events:none}';
  function css() {
    if (document.getElementById('k3mcss')) return;
    var s = document.createElement('style'); s.id = 'k3mcss'; s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }
  function toast(t) {
    var el = document.getElementById('k3mToast');
    if (!el) { el = document.createElement('div'); el.id = 'k3mToast'; document.body.appendChild(el); }
    el.textContent = t; el.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.style.display = 'none'; }, 1800);
  }
  function copy(i) {
    var a = OFFERING[i].acct, ok = L('已複製帳號', '已复制账号', 'Account number copied');
    function fb() {
      var ta = document.createElement('textarea'); ta.value = a; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(ok); } catch (e) { toast(a); }
      document.body.removeChild(ta);
    }
    try { navigator.clipboard.writeText(a).then(function () { toast(ok); }, fb); } catch (e) { fb(); }
  }
  function open() {
    css();
    var el = document.getElementById('k3mSheet');
    if (!el) { el = document.createElement('div'); el.id = 'k3mSheet'; document.body.appendChild(el); }
    el.innerHTML = '<div class="k3m-mask" onclick="K321MEET.close()"></div><div class="k3m-panel">' + sheet() + '</div>';
    el.className = 'on';
    try { document.documentElement.style.overflow = 'hidden'; } catch (e) {}
  }
  function close() {
    var el = document.getElementById('k3mSheet'); if (el) el.className = '';
    try { document.documentElement.style.overflow = ''; } catch (e) {}
  }
  function tick() {
    var slots = document.querySelectorAll('.k3m-slot');
    if (!slots.length) return;
    var h = nextCard();
    for (var i = 0; i < slots.length; i++) slots[i].innerHTML = h;
  }

  /* ── 掛到首頁 ── */
  function place() {
    var hook = CFG.hook;
    if (!hook || !hook.sel) return;
    var host = document.querySelector(hook.sel);
    if (!host) return;
    if (host.querySelector('[data-k3m]')) return;
    if (hook.need && !hook.need(host)) return;
    var tmp = document.createElement('div'); tmp.innerHTML = card();
    var node = tmp.firstChild;
    var ref = hook.before ? host.querySelector(hook.before) : null;
    if (ref && ref.parentNode) ref.parentNode.insertBefore(node, ref);
    else if (hook.where === 'start') host.insertBefore(node, host.firstChild);
    else if (hook.after && host.querySelector(hook.after)) { var a = host.querySelector(hook.after); a.parentNode.insertBefore(node, a.nextSibling); }
    else host.appendChild(node);
  }
  var pend = 0;
  function watch() {
    if (!CFG.hook || !CFG.hook.sel) return;
    place();
    try {
      new MutationObserver(function () {
        if (pend) return;
        pend = setTimeout(function () { pend = 0; place(); }, 60);
      }).observe(document.body, { childList: true, subtree: true });
    } catch (e) {}
  }
  function wrapFn(name, marker) {
    var orig = window[name];
    if (typeof orig !== 'function' || orig.__k3m) return false;
    var w = function () {
      var h = orig.apply(this, arguments);
      if (typeof h !== 'string' || h.indexOf('data-k3m') >= 0) return h;
      var cut = marker ? h.lastIndexOf(marker) : -1;
      return cut > 0 ? h.slice(0, cut) + card() + h.slice(cut) : h + card();
    };
    w.__k3m = 1;
    window[name] = w;
    return true;
  }

  window.K321MEET = { open: open, close: close, copy: copy, card: card, nextCard: nextCard, place: place, tick: tick };
  css();
  function boot() {
    css();
    if (CFG.wrap) {
      if (wrapFn(CFG.wrap, CFG.marker || '') && CFG.rerender) { try { CFG.rerender(); } catch (e) {} }
    }
    watch();
    setInterval(tick, 30000);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

<script id="VPICK">
/* VPICK321 v1（2026-10-23）：小智回答「做成美圖」時，從回答裡找出最合適的那一節經文
   ‧「>」引言裡帶章節的優先，其次是回答裡第一個帶章節的經文
   ‧ 經文用和合本原文（繁／简／英），資料讀互動聖經站的 toc.json 與 bible.{zh|zs|en}.*.json（GitHub Pages 有 CORS）
   ‧ VPICK321.pick(回答, 語言) → Promise<{t, ref, b, ch, v, v2} 或 null>；語言省略時自動判斷 */
(function () {
  if (window.VPICK321) return;
  var BASE = 'https://spch321-sudo.github.io/bible/';
  var TOC = null, BK = {}, SH = {}, RE = null, MAP = null;
  function getJ(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function toc() {
    if (TOC) return Promise.resolve(TOC);
    return getJ(BASE + 'toc.json').then(function (t) { TOC = t; for (var i = 0; i < t.length; i++) BK[t[i].id] = t[i]; return t; });
  }
  /* 依回答本身的文字判斷語言：英文字多就是英文；简体专用字比繁體專用字多就是简体 */
  var SIMP = '们这说为门国时会对发来过还后话让见语长东车书学习认识问题简体经龙马鸟鱼爱华听读写应该样么个们开关头亲给让钱进运选远连农战线现实实际义乐兴约须带币帐盖净渐'.split('');
  var TRAD = '們這說為門國時會對發來過還後話讓見語長東車書學習認識問題簡體經龍馬鳥魚愛華聽讀寫應該樣麼個們開關頭親給讓錢進運選遠連農戰線現實實際義樂興約須帶幣帳蓋淨漸'.split('');
  function detect(md) {
    var t = String(md || ''), cjk = (t.match(/[\u4e00-\u9fff]/g) || []).length, lat = (t.match(/[A-Za-z]/g) || []).length;
    if (cjk < 10 && lat > 40) return 'en';
    var a = 0, b = 0, i;
    for (i = 0; i < SIMP.length; i++) if (t.indexOf(SIMP[i]) >= 0) a++;
    for (i = 0; i < TRAD.length; i++) if (t.indexOf(TRAD[i]) >= 0) b++;
    if (a > b) return 'zs';
    if (b > a) return 'zh';
    return lang();
  }
  function lang() {
    var l = (document.documentElement.getAttribute('lang') || '').toLowerCase();
    if (/^en/.test(l)) return 'en';
    if (/hans|cn|sg/.test(l)) return 'zs';
    try { if (typeof S !== 'undefined' && S && S.set && S.set.sc) return 'zs'; } catch (e) { }
    try { var k = localStorage.getItem('k321_lang'); if (k === 'en') return 'en'; if (k === 'zh-Hans') return 'zs'; } catch (e) { }
    return 'zh';
  }
  function esc(n) { return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s*').replace(/^(\d)(?=[A-Za-z])/, '$1\\s*'); }
  function regex() {
    if (RE) return RE;
    MAP = {}; var raw = [];
    function add(n, id) { n = String(n || '').trim(); var k = n.replace(/\s+/g, '').toLowerCase(); if (k && !MAP[k]) { MAP[k] = id; raw.push(n); } }
    for (var i = 0; i < TOC.length; i++) { var b = TOC[i]; add(b.zh, b.id); add(b.zs, b.id); add(b.en, b.id); add(b.azh, b.id); add(b.azs, b.id); add(b.aen, b.id); }
    add('Psalm', 'Psalms'); add('Song of Songs', 'SongofSolomon'); add('詩', 'Psalms'); add('诗', 'Psalms');
    raw.sort(function (a, b) { return b.length - a.length; });
    var names = []; for (var j = 0; j < raw.length; j++) names.push(esc(raw[j]));
    RE = new RegExp('(' + names.join('|') + ')\\s*(\\d{1,3})\\s*(?:[:：]|[章篇]\\s*(?:第\\s*)?)\\s*(\\d{1,3})\\s*[節节]?(?:\\s*[-–—~～至到]\\s*(\\d{1,3}))?', 'gi');
    return RE;
  }
  function refs(text) {
    var re = regex(), out = [], lines = String(text || '').split('\n');
    for (var li = 0; li < lines.length; li++) {
      var line = lines[li], m; re.lastIndex = 0;
      while ((m = re.exec(line))) {
        var id = MAP[m[1].replace(/\s+/g, '').toLowerCase()], b = id && BK[id];
        if (!b) continue;
        var ch = +m[2], v = +m[3], v2 = m[4] ? +m[4] : 0;
        if (!ch || ch > b.ch || !v) continue;
        out.push({ b: id, ch: ch, v: v, v2: (v2 > v && v2 - v <= 6) ? v2 : 0, q: /^\s*(&gt;|>)/.test(line) });
      }
    }
    return out;
  }
  function shard(lg, b) {
    var k = lg + '|' + b.shard;
    if (!SH[k]) SH[k] = getJ(BASE + 'bible.' + lg + '.' + b.shard + '.json').catch(function (e) { delete SH[k]; throw e; });
    return SH[k];
  }
  function clean(t) {
    var P = [['「', '」'], ['『', '』'], ['“', '”'], ['‘', '’']];
    for (var i = 0; i < P.length; i++) {
      var o = P[i][0], c = P[i][1], no = t.split(o).length - 1, nc = t.split(c).length - 1, k;
      if (no > nc) for (k = no - nc; k > 0 && t.indexOf(o) >= 0; k--) t = t.replace(o, '');
      else if (nc > no) for (k = nc - no; k > 0 && t.lastIndexOf(c) >= 0; k--) { var x = t.lastIndexOf(c); t = t.slice(0, x) + t.slice(x + 1); }
    }
    return t.trim();
  }
  function verse(lg, r) {
    var b = BK[r.b];
    return shard(lg, b).then(function (d) {
      var arr = d[r.b] && d[r.b][r.ch - 1]; if (!arr) return '';
      var hi = r.v2 || r.v, cur = 0, parts = [];
      for (var i = 0; i < arr.length; i++) {
        var seg = arr[i]; if (!seg || !seg.length) continue;
        for (var j = 1; j + 1 < seg.length; j += 2) {
          if (+seg[j] > 0) cur = +seg[j];
          if (cur >= r.v && cur <= hi && seg[j + 1]) parts.push(String(seg[j + 1]));
        }
      }
      return clean(parts.join(lg === 'en' ? ' ' : '').replace(/〔[^〕]*〕/g, '').replace(/\s+/g, ' ').trim());
    });
  }
  function label(lg, r) {
    var b = BK[r.b], nm = lg === 'en' ? (b.en || b.zh) : (lg === 'zs' ? b.zs : b.zh);
    return nm + ' ' + r.ch + ':' + r.v + (r.v2 ? '-' + r.v2 : '');
  }
  function pick(md, lg) {
    lg = lg || (/^en/i.test(document.documentElement.getAttribute('lang') || '') ? 'en' : detect(md));
    return toc().then(function () {
      var all = refs(md), order = [], i;
      for (i = 0; i < all.length; i++) if (all[i].q) order.push(all[i]);
      for (i = 0; i < all.length; i++) if (!all[i].q) order.push(all[i]);
      var k = 0;
      function next() {
        if (k >= order.length || k >= 6) return null;
        var r = order[k++];
        return verse(lg, r).then(function (t) {
          if (!t) return next();
          r.t = t; r.ref = label(lg, r); return r;
        }, function () { return next(); });
      }
      return next();
    });
  }
  /* 給各 App 的「做成美圖」用：找到經文就 open({t,ref,n:''})，找不到就 open(原本的內容) */
  function card(md, open, fallback) {
    pick(md).then(function (r) { if (r) open({ t: r.t, ref: r.ref, n: '' }); else open(fallback); }, function () { open(fallback); });
  }
  window.VPICK321 = { pick: pick, card: card, lang: lang, detect: detect, refs: function (t) { return toc().then(function () { return refs(t); }); } };
})();
</script>
